{% if docs_versions %}
<details class="version-switcher">
  <summary>Version: {{ docs_version }}</summary>
  <nav aria-label="Documentation versions">
    <ul>
      {% for name in docs_versions %}
      <li>
        <a href="{{ pathto('../' ~ name ~ '/index') }}"{% if name == docs_version %} aria-current="true"{% endif %}>{{ name }}</a>
      </li>
      {% endfor %}
    </ul>
  </nav>
</details>
{% endif %}
