name: kcoral

services:
  kcoral:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cu130.dev
    image: kcoral:cu130-dev
    init: true
    gpus: all
    environment:
      KCORAL_SERVER_GPUS: "${KCORAL_SERVER_GPUS:-0}"
      KCORAL_SERVER_HOST: 0.0.0.0
      KCORAL_SERVER_PORT: "8000"
    ports:
      - "127.0.0.1:${KCORAL_SERVER_PORT:-8000}:8000"
    volumes:
      - ..:/workspace/kcoral
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
