name: benchmark-server

services:
  benchmark-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cu130.dev
    image: benchmark-server:cu130-dev
    init: true
    gpus: all
    environment:
      BENCH_GPUS: "${BENCH_GPUS:-0}"
      BENCH_HOST: 0.0.0.0
      BENCH_PORT: "8000"
    ports:
      - "127.0.0.1:${BENCH_PORT:-8000}:8000"
    volumes:
      - ..:/workspace/benchmark-server
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
