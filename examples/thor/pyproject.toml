[project]
name = "kcoral-thor-gemm-example"
version = "0.1.0"
description = "Agentic TIRx GEMM optimization on a remote NVIDIA Thor through KCoral"
requires-python = ">=3.10"
dependencies = [
    # Client for the remote Thor server; this example lives inside the KCoral checkout.
    "kcoral",
    # Same TVM as the server's lock. Only its sources are used locally: they are the
    # TIRx API reference for the agent. Kernels are compiled and run on the server.
    "apache-tvm==0.26.0",
]

[tool.uv]
package = false

[tool.uv.sources]
kcoral = { path = "../..", editable = true }
