name: Gateway and CPU tests
on: [push, pull_request]
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.10'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: uv sync --frozen --no-editable --group test
      - run: uv run --no-project --with grpcio-tools==1.66.2 --with protobuf==5.27.2 python scripts/generate_gateway.py --check
      - run: uv run --no-sync pytest -q -o pythonpath=
        env:
          KCORAL_REQUIRE_GATEWAY_TESTS: '1'
          CUDA_VISIBLE_DEVICES: ''
