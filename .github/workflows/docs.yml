name: Documentation

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A new release rebuilds latest from main as well as every release tag.
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'main' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: |
            docs/requirements.txt
            pyproject.toml
      - name: Build the documentation website
        env:
          LATEST_ONLY: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: |
          if [ "$LATEST_ONLY" = "true" ]; then
            python scripts/build_docs.py --latest-only
          else
            python scripts/build_docs.py
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: _site
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: mlc-ai/kcoral-docs
          ref: main
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}
          path: public-docs
      - uses: actions/download-artifact@v8
        with:
          name: documentation-html
          path: _site
      - name: Publish the static website
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          rsync -a --delete --exclude=.git --exclude=.kcoral-docs-site _site/ public-docs/
          printf '%s\n' 'kcoral.mlc.ai' > public-docs/CNAME
          git -C public-docs config user.name 'github-actions[bot]'
          git -C public-docs config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C public-docs add --all
          if ! git -C public-docs diff --cached --quiet; then
            git -C public-docs commit -m "Publish documentation from $SOURCE_SHA"
            git -C public-docs push origin HEAD:main
          fi
