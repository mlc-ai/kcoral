name: Documentation

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A new release rebuilds latest from main as well as every release tag.
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'main' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: |
            docs/requirements.txt
            pyproject.toml
      - name: Build the documentation website
        env:
          LATEST_ONLY: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: |
          if [ "$LATEST_ONLY" = "true" ]; then
            python scripts/build_docs.py --latest-only
          else
            python scripts/build_docs.py
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: _site
          include-hidden-files: true
          if-no-files-found: error
