name: Documentation

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.repository == 'mlc-ai/kcoral' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A new release rebuilds latest from main as well as every release tag.
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'main' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            docs/requirements.txt
            pyproject.toml
      - name: Build the documentation website
        run: python scripts/build_docs.py ${{ github.event_name == 'pull_request' && '--latest-only' || '' }}
      - name: Publish to gh-pages
        if: env.PUBLISH == 'true'
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          cname: kcoral.mlc.ai
      - name: Request GitHub Pages build
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN pushes do not automatically trigger a Pages build.
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
