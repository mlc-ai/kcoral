[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-server"
version = "0.1.0"
description = "Stateless remote execution engine for benchmarking GPU kernels (instruction-sequence protocol)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "numpy>=1.24",
  "ml_dtypes>=0.5", # the bfloat16 and float8 scalar types numpy lacks
]

[project.scripts]
benchmark-server = "benchmark_server.__main__:main"

[dependency-groups]
test = [
  "pytest>=8",
]
gpu = [
  "torch>=2.9",
  "apache-tvm==0.26.0rc0",
  "apache-tvm-ffi[cpp]==0.1.13.post2",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["benchmark_server*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # unused-import: re-exports

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80
