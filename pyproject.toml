[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-server"
version = "0.1.0"
description = "Stateless remote execution engine for benchmarking GPU kernels (instruction-sequence protocol)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

# torch and tvm_ffi are mandatory in the GPU worker but are supplied by the
# environment (not pinned here). Full tvm is optional — only `compile_tirx` needs
# it. The front-end, engine, cache, and worker-management layers import none.
[project.optional-dependencies]
test = [
  "pytest>=8",
  "httpx>=0.27",
]

[project.scripts]
benchmark-server = "benchmark_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["benchmark_server*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # unused-import: re-exports

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80
