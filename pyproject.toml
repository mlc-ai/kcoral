[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "benchmark-server"
version = "0.1.0"
description = "Synchronous client and isolated GPU execution server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "apache-tvm-ffi>=0.1.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "python-multipart>=0.0.18",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "numpy>=1.24",
  "pytest>=8",
]

[project.scripts]
benchmark-server = "benchmark_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/benchmark_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
