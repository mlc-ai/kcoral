[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "setuptools-rust>=1.11,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "kcoral"
dynamic = ["version"]
description = "Stateless remote execution engine for benchmarking GPU kernels (instruction-sequence protocol)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.24",
  "ml_dtypes>=0.5", # the bfloat16 and float8 scalar types numpy lacks
]

# The base install supports clients and, in Linux wheels, the Rust router. The server extra
# supplies both GPU execution and CPU compilation dependencies.
[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "grpcio>=1.66.2",
  "protobuf>=5.27.2",
  "uvicorn>=0.29",
  "torch>=2.14",
  "apache-tvm>=0.27.0",
  "apache-tvm-ffi[cpp]>=0.1.14.post0",
  "nvidia-cutlass-dsl[cu13]==4.7.0",
  "cupti-python>=13.0.1",
  "flashinfer-python>=0.6.17",
]

[project.scripts]
kcoral = "kcoral.__main__:main"

[dependency-groups]
server = ["kcoral[server]"]
test = [
  "kcoral[server]", # the suite exercises the server
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["kcoral*"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["python/kcoral/server/_generated/kcoral_gateway_pb2.py", "python/kcoral/server/_generated/kcoral_gateway_pb2_grpc.py"]
line-length = 100
target-version = "py310"
# First-party detection for import sorting; ruff's default is [".", "src"].
src = [".", "python"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # unused-import: re-exports

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80
