[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-server"
version = "0.1.0"
description = "Stateless remote execution engine for benchmarking GPU kernels (instruction-sequence protocol)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

# torch and the TIRx-enabled `tvm` build are supplied by the GPU runtime and are
# imported only inside the worker's real Runtime (Phase 2). The engine, cache,
# server, and worker-management layer run and test without them.
[project.optional-dependencies]
test = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["benchmark_server*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
